# T029 — Continuous deployment to Cloudflare Workers (constitution, Workflow 6; research R12).
# Runs only after the CI workflow succeeded for a push to main (i.e. a merged PR), and deploys
# exactly the commit CI tested: D1 migrations first, then the Worker + static assets.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once, and never cancel one half-way through migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested (workflow_run), or the branch head (manual run).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply todo-db --remote

      - name: Deploy Worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url" >> "$GITHUB_STEP_SUMMARY"
